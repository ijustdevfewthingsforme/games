<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elliot Air · After Dark</title>
<meta name="theme-color" content="#0a1328">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Anton&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Monopoly-style 6x6 perimeter board (20 squares) with the dice and turn in the middle; cards open as boarding-pass sheets over the board. Single dark theme, Elliot Air brand, night palette that warms as the heat rises. */
@property --accent{syntax:"<color>";inherits:true;initial-value:#ffc94a}
@property --glow{syntax:"<color>";inherits:true;initial-value:rgba(255,201,74,.14)}
:root{
  color-scheme: dark;
  --bg:#0a1328;
  --surf:#111d38;
  --surf-2:#16244a;
  --line:#22355c;
  --text:#f3f1ec;
  --muted:#9ea8c2;
  --accent:#ffc94a;
  --blush:#f4b6c4;
  --hot:#ff5a6e;
  --glow:rgba(255,201,74,.14);
  --paper:#f7f3ea;
  --ink:#141b2e;
  --navy:#13213f;
  --f-display:"Instrument Serif", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-code:"Anton", Impact, "Arial Narrow", sans-serif;
  transition:--accent .8s, --glow .8s;
}
:root[data-heat="2"]{--accent:#ff9a6b;--glow:rgba(255,120,90,.18)}
:root[data-heat="3"]{--accent:#ff5a6e;--glow:rgba(255,70,100,.24)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 28px}
[hidden]{display:none!important}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%, var(--glow), transparent 70%),radial-gradient(700px 400px at 50% 110%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-code);font-size:16px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.logo svg{width:24px;height:24px}
.logo small{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--accent);margin-left:2px}
.top-btns{display:flex;gap:6px}
.icon-btn{appearance:none;cursor:pointer;height:34px;min-width:34px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb, var(--surf) 80%, transparent);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700}
.icon-btn svg{width:15px;height:15px}
.icon-btn:hover{border-color:var(--muted)}

/* Players */
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .3s, box-shadow .3s;min-width:0}
.pl.active{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc), 0 10px 30px -14px var(--pc)}
.pl-head{display:flex;align-items:center;gap:8px;min-width:0}
.tok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--ink);flex:none}
.tok svg{width:14px;height:14px}
.pl-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-turn{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc);opacity:0;transition:opacity .3s;white-space:nowrap}
.pl.active .pl-turn{opacity:1}
.pl-stats{display:flex;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.pl-stats b{color:var(--text);font-weight:500}

/* Heat */
.heat{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.heat-bar{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.heat-bar button{appearance:none;cursor:pointer;height:8px;border:0;border-radius:99px;background:var(--line);padding:0}
.heat-bar button.on{background:var(--accent)}
.heat b{color:var(--accent);font-weight:500;min-width:92px;text-align:right}

/* Board */
.board{position:relative;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;aspect-ratio:1/1;width:100%;max-width:100%}
.sq{position:relative;border-radius:10px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 3px;text-align:center;overflow:hidden;min-width:0;min-height:0}
.sq .ic{width:20px;height:20px;color:var(--muted)}
.sq .lb{font-size:9.5px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.sq .pr{font-family:var(--f-mono);font-size:8.5px;color:var(--muted)}
.sq.dest{padding-top:12px}
.sq.dest::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--dc)}
.sq.dest .lb{font-family:var(--f-code);font-weight:400;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.sq.owned{box-shadow:inset 0 0 0 2px var(--oc)}
.sq .own{position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;background:var(--oc)}
.sq.corner{background:var(--navy);border-color:color-mix(in srgb, var(--accent) 35%, var(--line))}
.sq.corner .ic{width:24px;height:24px;color:var(--accent)}
.sq.corner .lb{font-family:var(--f-code);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.sq.k-turb .ic{color:#ff8fa3}.sq.k-duty .ic{color:#7fd6cf}.sq.k-customs .ic{color:#b9b2ff}.sq.k-lounge .ic{color:#ffc94a}
.sq.flash{animation:flash .8s ease}
@keyframes flash{30%{background:color-mix(in srgb, var(--accent) 30%, var(--surf))}}
.tokens{position:absolute;left:3px;top:3px;display:flex;gap:2px;z-index:2}
.sq.dest .tokens{top:11px}
.ptok{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.5);animation:hop .2s ease}
.ptok svg{width:12px;height:12px}
@keyframes hop{50%{transform:translateY(-5px) scale(1.1)}}

/* Center */
.center{grid-column:2 / 6;grid-row:2 / 6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;border-radius:18px;background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%);text-align:center;min-width:0}
.center .brand{font-family:var(--f-display);font-style:italic;font-size:clamp(22px,5.4vw,34px);line-height:1;color:var(--text)}
.center .brand em{color:var(--accent)}
.whose{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.whose b{color:var(--pc);font-weight:500}
.dice{display:flex;gap:10px}
.die{width:clamp(48px,13vw,62px);aspect-ratio:1;border-radius:12px;background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13%;box-shadow:0 8px 18px -8px rgba(0,0,0,.7), inset 0 -3px 0 rgba(0,0,0,.12)}
.die i{width:82%;height:82%;margin:auto;border-radius:50%;background:var(--ink);opacity:0}
.die i.on{opacity:1}
.die.roll{animation:roll .5s ease}
@keyframes roll{0%{transform:rotate(0)}40%{transform:rotate(-25deg) translateY(-6px)}100%{transform:rotate(0)}}
.btn{appearance:none;cursor:pointer;font-weight:800;font-size:15px;border-radius:99px;padding:13px 22px;border:1px solid var(--accent);background:var(--accent);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s, opacity .2s, box-shadow .2s;box-shadow:0 10px 26px -12px var(--glow)}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.outline{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none;font-weight:600;font-size:13px;padding:8px 12px}
.btn.small{padding:9px 14px;font-size:13px}
.last{font-size:12px;color:var(--muted);min-height:1.4em;max-width:30ch}

/* Sheet / cards */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:rgba(5,8,18,.7);backdrop-filter:blur(6px)}
@media (min-width:640px){ .sheet{align-items:center} }
.card{width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 30px 70px -20px #000;animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2) both;clip-path:inset(0 round 20px)}
@keyframes cardIn{from{transform:translateY(40px) rotate(-2deg) scale(.95);opacity:0}to{transform:none;opacity:1}}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--cc,var(--navy));color:#fff}
.card-head svg{width:20px;height:20px;flex:none}
.card-head .deck{font-family:var(--f-code);font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.card-head .hl{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.card-body{padding:18px 20px 8px;display:flex;flex-direction:column;gap:10px}
.card-who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b8298}
.card-title{font-family:var(--f-display);font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.card-title em{color:var(--cc2,#b0425f)}
.card-text{font-size:16px;line-height:1.5;color:#2b3247;margin:0}
.card-meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(20,27,46,.18);border-radius:99px;padding:3px 9px;color:#4a5168}
.timer{display:flex;align-items:center;gap:14px;padding:4px 0}
.ring{--p:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--cc,var(--navy)) calc(var(--p)*1turn), rgba(20,27,46,.1) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 20px}
.card-actions .btn{flex:1 1 auto}
.card .btn{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:none}
.card .btn.outline{background:transparent;color:var(--ink);border-color:rgba(20,27,46,.2)}
.card .btn.ghost{background:transparent;border-color:transparent;color:#6b7186}
.card .btn.hotbtn{background:var(--cc,var(--navy));border-color:var(--cc,var(--navy))}

/* Setup */
.setup{display:flex;flex-direction:column;gap:18px;padding-block:6px 10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,10vw,72px);line-height:1;margin:0;text-wrap:balance}
h1 em{color:var(--accent)}
.lead{font-size:17px;color:var(--text);opacity:.9;max-width:52ch;margin:0}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.panel p{margin:0;font-size:13px;color:var(--muted)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.names input{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button,.chip{appearance:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:10px 8px;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.seg button small{font-weight:500;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex-direction:row;border-radius:99px;padding:9px 14px;font-weight:600}
.chip svg{width:14px;height:14px;opacity:.8}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13.5px;color:var(--text)}
.rules li svg{width:16px;height:16px;margin-top:2px;color:var(--accent)}

/* Log + footer */
.log{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);max-height:120px;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb, var(--surf) 70%, transparent)}
.log p{margin:0}
.log b{color:var(--text);font-weight:600}
.pause{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,8,18,.88);backdrop-filter:blur(14px);text-align:center;padding:24px}
.pause h2{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0 0 6px}
.pause p{color:var(--muted);margin:0 0 18px}
#toasts{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top, 0px));display:flex;flex-direction:column;gap:6px;width:min(420px, calc(100vw - 32px));pointer-events:none}
.toast{background:var(--surf);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:0 14px 30px -14px #000;animation:cardIn .35s ease both}
.heart-fx{position:fixed;z-index:31;pointer-events:none;color:var(--blush);animation:float 1.8s ease-out forwards}
@keyframes float{to{transform:translateY(-55vh) rotate(25deg);opacity:0}}

@media (max-width:520px){
  .sq .lb{font-size:8px}
  .sq.dest .lb{font-size:8.5px;letter-spacing:0}
  .sq .ic{width:16px;height:16px}
  .sq.corner .ic{width:20px;height:20px}
  .sq.corner .lb{font-size:8.5px}
  .sq .pr{display:none}
  .board{gap:3px}
  .sq{border-radius:8px;padding:3px 2px}
  .ptok{width:16px;height:16px}.ptok svg{width:10px;height:10px}
  .logo small{display:none}
  .pl-turn{display:none}
  .pl{padding:9px 10px}
  .pl-stats{gap:8px;font-size:11px}
  .btn{padding:12px 18px}
  .top-btns .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main class="wrap" id="app"></main>
<div id="sheetHost"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ---------- Icons ---------- */
const LOGO = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffc94a" d="M21.5 15.5v-2L13.5 8.5V3a1.5 1.5 0 0 0-3 0v5.5l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5l-2-1.5v-5.5z"/><g fill="#13213f" fill-opacity=".78" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="3.1"><text x="17.4" y="13.8" text-anchor="middle" transform="rotate(32 17.4 12.7)">E</text><text x="17.4" y="13.8" text-anchor="middle" transform="matrix(-1 0 0 1 24 0) rotate(32 17.4 12.7)">E</text></g></svg>`;
const ic = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  plane: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 15.5v-2L13.5 8.5V3a1.5 1.5 0 0 0-3 0v5.5l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5l-2-1.5v-5.5z"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
  duty: ic('<path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'),
  turb: ic('<path d="M3 10c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M3 16c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>'),
  lounge: ic('<path d="M5 5h14l-7 8z"/><path d="M12 13v6M8 19h8"/>'),
  customs: ic('<rect x="6" y="3.5" width="12" height="17" rx="2"/><circle cx="12" cy="10.5" r="3"/><path d="M9 16.5h6"/>'),
  layover: ic('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),
  security: ic('<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/>'),
  mile: ic('<path d="M12 20s-6-3.8-6-8.5A3.4 3.4 0 0 1 12 9.3a3.4 3.4 0 0 1 6 2.2C18 16.2 12 20 12 20z"/><path d="M12 4v2M5 6l1.4 1.4M19 6l-1.4 1.4"/>'),
  gate: ic('<path d="M4 20V5"/><path d="M4 5h12l-2 4 2 4H4"/>'),
  pause: ic('<path d="M9 6v12M15 6v12"/>'),
  restart: ic('<path d="M4 4v6h6"/><path d="M5 15a7 7 0 1 0 2-7.3L4 10"/>'),
  rules: ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>'),
  check: ic('<path d="M5 12l4 4 10-10"/>'),
  pass: ic('<path d="M4 8h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/>'),
  flame: ic('<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/>'),
  stop: ic('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 15.5l7-7"/>')
};

/* ---------- Content ---------- */
const HEAT = ["", "Warm-up", "Heating up", "After dark"];
const ITEMS = [
  {id:"blindfold", name:"Blindfold"}, {id:"oil", name:"Massage oil"}, {id:"ice", name:"Ice cubes"},
  {id:"feather", name:"Feather"}, {id:"ties", name:"Silk ties"}, {id:"toy", name:"A toy"},
  {id:"cream", name:"Whipped cream / chocolate"}, {id:"candle", name:"Massage candle"}
];
/* Destinations: buy them, then your partner pays in miles or with the city's dare */
const DEST = {
  phuket:{name:"Phuket", price:120, color:"#2ec4b6", dares:[
    "Beach massage. Rub your partner's shoulders for 1 minute.",
    "Sunscreen routine. Slowly 'apply sunscreen' (or oil) all over your partner's back.",
    "Island hopping. Kiss your way from their neck down to their hips."]},
  bali:{name:"Bali", price:140, color:"#2ec4b6", dares:[
    "Foreheads together, breathe in sync for 30 seconds, then one slow kiss.",
    "Yoga retreat. Hold any pose your partner picks while they kiss you.",
    "Private villa. Remove two pieces of your partner's clothing, very slowly."]},
  paris:{name:"Paris", price:180, color:"#ff7aa8", dares:[
    "A proper French kiss. 20 seconds, no rushing.",
    "Whisper something naughty in French, or in your best French accent.",
    "Paris after dark. Your partner picks a position from the Turbulence deck. 90 seconds."]},
  tokyo:{name:"Tokyo", price:200, color:"#ff7aa8", dares:[
    "Hand massage, finger by finger, for 1 minute.",

/* ---------- Helpers ---------- */
function toast(txt){
  const el = document.createElement("div"); el.className = "toast"; el.textContent = txt;
  document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 3200);
}
function hearts(n){
  if (reduceMotion) return;
  for (let i=0;i<n;i++){
    const h = document.createElement("div"); h.className = "heart-fx"; h.textContent = "♥";
    h.style.left = (8 + Math.random()*84) + "vw"; h.style.top = (55 + Math.random()*30) + "vh";
    h.style.animationDelay = (Math.random()*.5) + "s"; h.style.fontSize = (13 + Math.random()*18) + "px";
    document.body.appendChild(h); setTimeout(() => h.remove(), 2600);
  }
}
function log(html){ S.log.unshift(html); S.log = S.log.slice(0, 40); }
function setHeat(h){ S.heat = Math.max(1, Math.min(3, h)); document.documentElement.dataset.heat = S.heat; }
function chime(){
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(880, a.currentTime); o.frequency.exponentialRampToValueAtTime(1320, a.currentTime + .25);
    g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.2, a.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .7);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .75);
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch(e){}
}
function draw(deckId){
  const deck = DECKS[deckId].cards;
  const fits = c => c.h <= S.heat && (deckId !== "duty" || !c.i || S.items.includes(c.i));
  const idx = deck.map((c,i) => i).filter(i => fits(deck[i]));
  let pool = idx.filter(i => deck[i].h === S.heat && !(S.used[deckId] || []).includes(i));
  if (deckId === "duty") pool = pool.filter(i => deck[i].i || !idx.some(j => deck[j].h === S.heat && deck[j].i));
  if (!pool.length) pool = idx.filter(i => !(S.used[deckId] || []).includes(i));
  if (!pool.length){ S.used[deckId] = []; pool = idx; }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  (S.used[deckId] = S.used[deckId] || []).push(pick);
  return deck[pick];
}

    body = `<div class="card-who">${esc(p.name)}, welcome to ${esc(owner.name)}'s city</div><p class="card-title">Pay the <em>local tax</em></p><p class="card-text">Pay <b>${rent(o.d)} miles</b> to ${esc(owner.name)}, or do the ${d.name} dare (${HEAT[S.heat].toLowerCase()}).</p>`;
    actions = `<button class="btn hotbtn" data-act="dare" data-d="${o.d}">Do the dare</button><button class="btn outline" data-act="payRent" data-d="${o.d}" data-sq="${o.sq}">Pay ${rent(o.d)} mi</button>`;
  }
  else if (o.deck === "dare"){
    const d = DEST[o.d]; cc = d.color;
    head = `${ICON.flame}<span class="deck">${d.name} dare</span><span class="hl">${HEAT[S.heat]}</span>`;
    body = `<div class="card-who">${esc(p.name)}</div><p class="card-text" style="font-size:19px;color:#141b2e">${esc(d.dares[S.heat-1])}</p>${timerBlock(o.s || 0)}`;
    actions = `<button class="btn hotbtn" data-act="end">${ICON.check.replace('<svg','<svg style="width:15px;height:15px"')}Done</button>${passBtn}`;
  }
  else if (DECKS[o.deck]){
    const D = DECKS[o.deck], c = o.card; cc = D.color;
    head = `${ICON[D.icon]}<span class="deck">${D.name}</span><span class="hl">${HEAT[c.h]}</span>`;
    const who = o.deck === "customs" ? `${esc(p.name)} answers` : o.deck === "turb" ? `${esc(p.name)} & ${esc(them.name)}` : esc(p.name);
    body = `<div class="card-who">${who} · ${D.sub}</div>
      ${c.n ? `<p class="card-title">${esc(c.n)}</p>` : ""}
      <p class="card-text" style="${c.n ? "" : "font-size:19px;color:#141b2e"}">${esc(c.t)}</p>
      ${c.i ? `<div class="card-meta"><span class="tag">${esc(ITEMS.find(x => x.id===c.i).name)}</span></div>` : ""}
      ${timerBlock(c.s || 0)}`;
    const effectNote = c.fx ? "OK" : "Done";
    actions = `<button class="btn hotbtn" data-act="cardDone">${ICON.check.replace('<svg','<svg style="width:15px;height:15px"')}${effectNote}</button>${c.fx && c.fx !== "draw" ? "" : passBtn}`;
  }
  else if (o.deck === "corner"){
    cc = "#13213f";
    head = `${ICON[o.icon]}<span class="deck">${o.title}</span>`;
    body = `<div class="card-who">${esc(p.name)}</div><p class="card-title">${o.big}</p><p class="card-text">${o.text}</p>`;
    actions = `<button class="btn" data-act="${o.act || "end"}">${o.btn || "Continue"}</button>`;
  }
  else if (o.deck === "layover"){
    head = `${ICON.layover}<span class="deck">Layover</span><span class="hl">Attempt ${3 - p.jail + 1} of 3</span>`;
    body = `<div class="card-who">${esc(p.name)} is stuck in Layover</div><p class="card-title">Roll a <em>double</em> to leave</p><p class="card-text">Or buy your way out: ${esc(them.name)} invents a dare for you right now. Do it and you leave immediately.</p>`;
    actions = `<button class="btn" data-act="jailRoll">Roll for a double</button><button class="btn outline" data-act="jailDare">I did ${esc(them.name)}'s dare</button>`;
  }
  else if (o.deck === "end"){
    const w = o.winner, l = S.players[1 - S.players.indexOf(w)];
    head = `${ICON.mile}<span class="deck">Landed</span><span class="hl">Game over</span>`;
    body = `<div class="card-who">${esc(o.reason)}</div><p class="card-title"><em>${esc(w.name)}</em> wins the flight.</p>
      <p class="card-text">${esc(w.name)} ${fmt(score(w))} mi · ${esc(l.name)} ${fmt(score(l))} mi (miles + cities owned)</p>
      <div class="card-who" style="margin-top:6px">Grand prize</div><p class="card-text" style="font-size:19px;color:#141b2e">${esc(o.prize)}</p>`;
    actions = `<button class="btn" data-act="reset">Play again</button><button class="btn outline" data-act="close">Look at the board</button>`;
  }

  host.innerHTML = `<div class="sheet"><div class="card" role="dialog" aria-modal="true" style="--cc:${cc}"><div class="card-head">${head}</div><div class="card-body">${body}</div><div class="card-actions">${actions}</div></div></div>`;
  const first = host.querySelector(".card-actions .btn"); if (first) first.focus({preventScroll:true});
  host.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act, b.dataset, o));
}
const rent = d => Math.round(DEST[d].price * .4 / 10) * 10;
const score = p => p.miles + Object.entries(S.owner).filter(([,o]) => S.players[o]===p).reduce((a,[i]) => a + DEST[BOARD[i].d].price, 0);

function act(a, ds, o){
  const p = P(), them = O();
  if (a === "close") return closeSheet();
  if (a === "reset"){ closeSheet(); try { localStorage.removeItem("ea-afterdark"); } catch(e){} const keep = {names:S.players.map(x=>x.name), items:S.items, startHeat:S.startHeat, laps:S.laps}; S = DEFAULT(); S.players.forEach((x,i)=>x.name=keep.names[i]); Object.assign(S,{items:keep.items,startHeat:keep.startHeat,laps:keep.laps}); setHeat(1); return renderSetup(); }
  if (a === "timer"){
    const total = +ds.s; let left = total; const ring = document.getElementById("ring"), tl = document.getElementById("tleft");
    clearInterval(timerInt);
    timerInt = setInterval(() => { left--; tl.textContent = left + "s"; ring.style.setProperty("--p", (1 - left/total).toFixed(3)); if (left <= 0){ clearInterval(timerInt); tl.textContent = "✓"; chime(); } }, 1000);
    return;
  }
  if (a === "pass"){
    if (p.passes) { p.passes--; log(`<b>${esc(p.name)}</b> used a Pass.`); }
    else { p.miles -= 100; log(`<b>${esc(p.name)}</b> skipped for 100 miles.`); }
    return endTurn();
  }
  if (a === "buy"){
    const d = DEST[ds.d]; p.miles -= d.price; S.owner[p.pos] = S.turn;
    log(`<b>${esc(p.name)}</b> bought <b>${d.name}</b>.`); hearts(6);
    return endTurn();
  }
  if (a === "dare") return sheet({deck:"dare", d:ds.d, s:[30,60,90][S.heat-1]});
  if (a === "payRent"){
    const owner = S.players[S.owner[+ds.sq]], v = rent(ds.d);
    p.miles -= v; owner.miles += v; log(`<b>${esc(p.name)}</b> paid ${v} mi to <b>${esc(owner.name)}</b>.`);
    return endTurn();
  }
  if (a === "cardDone"){
    const c = o.card;
    if (c.fx === "miles"){ p.miles += c.v; log(`<b>${esc(p.name)}</b> +${c.v} mi.`); }
    if (c.fx === "pass"){ p.passes++; log(`<b>${esc(p.name)}</b> got an extra Pass.`); }
    if (c.fx === "toLayover") return goLayover();
    if (c.fx === "toGate"){ closeSheet(); return moveTo(0, true); }
    if (c.fx === "swap"){ [p.pos, them.pos] = [them.pos, p.pos]; log(`Seats swapped.`); placeTokens(); return endTurn(); }
    if (c.fx === "draw") return sheet({deck:c.v, card:draw(c.v)});
    return endTurn();
  }
  if (a === "goLayover") return goLayover();
  if (a === "jailRoll"){ closeSheet(); return roll(true); }
  if (a === "jailDare"){ p.jail = 0; log(`<b>${esc(p.name)}</b> did a dare and left Layover.`); closeSheet(); save(); return renderGame(); }
  if (a === "end") return endTurn();
}

/* ---------- Turn flow ---------- */
function rollDice(){ return [1 + Math.floor(Math.random()*6), 1 + Math.floor(Math.random()*6)]; }
async function animateDice(d){
  const els = [document.getElementById("d0"), document.getElementById("d1")];
  if (!reduceMotion){
    for (let k=0;k<6;k++){ const r = rollDice(); els.forEach((e,j) => { e.outerHTML = dieHTML(r[j], "d"+j); }); await wait(70); els[0] = document.getElementById("d0"); els[1] = document.getElementById("d1"); }
  }
  document.getElementById("d0").outerHTML = dieHTML(d[0], "d0");
  document.getElementById("d1").outerHTML = dieHTML(d[1], "d1");
  document.querySelectorAll(".die").forEach(e => e.classList.add("roll"));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function roll(fromJail){
  if (busy || S.over) return; busy = true;
  const btn = document.getElementById("rollBtn"); if (btn) btn.disabled = true;
  const d = rollDice(); S.dice = d;
  await animateDice(d);
  const p = P(), dbl = d[0] === d[1];
  if (fromJail){
    if (dbl){ p.jail = 0; log(`<b>${esc(p.name)}</b> rolled a double and left Layover.`); S.doubles = 0; }
    else {
      p.jail--;
      if (p.jail <= 0){ p.jail = 0; p.miles -= 100; log(`<b>${esc(p.name)}</b> paid 100 mi to leave Layover.`); }
      else { log(`<b>${esc(p.name)}</b> stays in Layover.`); busy = false; S.last = `No double (${d[0]}+${d[1]}).`; return endTurn(true); }
    }
  } else if (dbl){
    S.doubles++;
    if (S.doubles >= 3){ S.doubles = 0; busy = false; log(`Three doubles. <b>${esc(p.name)}</b> is sent to Layover.`); return goLayover(); }
  } else S.doubles = 0;
  S.last = `${esc(p.name)} rolled ${d[0]} + ${d[1]}${dbl && !fromJail ? ". Double, roll again after this" : ""}.`;
  const lc = document.querySelector(".last"); if (lc) lc.innerHTML = S.last;
  await moveBy(d[0] + d[1]);
  busy = false;
  land();
}
async function moveBy(n){
  const p = P();
  for (let k=0;k<n;k++){
    p.pos = (p.pos + 1) % 20;
    if (p.pos === 0) passGate();
    placeTokens();
    await wait(reduceMotion ? 0 : 170);
  }
  const sq = document.getElementById("sq"+p.pos); if (sq){ sq.classList.remove("flash"); void sq.offsetWidth; sq.classList.add("flash"); }
}
async function moveTo(target, collect){
  const p = P(); busy = true;
  while (p.pos !== target){ p.pos = (p.pos + 1) % 20; if (p.pos === 0 && collect) passGate(); placeTokens(); await wait(reduceMotion ? 0 : 90); }
  busy = false; land();
}
function passGate(){
  const p = P(); p.miles += 200; p.laps++;
  log(`<b>${esc(p.name)}</b> passed the Gate: +200 mi.`); toast(`${p.name} passed the Gate · +200 miles`);
  const minLaps = Math.min(...S.players.map(x => x.laps));
  if (S.autoHeat){ const h = Math.min(3, S.startHeat + minLaps); if (h > S.heat){ setHeat(h); toast(`Heat rising: ${HEAT[h]}`); log(`Heat rose to <b>${HEAT[h]}</b>.`); hearts(10); } }
}
function land(){
  const p = P(), sq = BOARD[p.pos];
  save();
  if (sq.k === "dest"){
    const own = S.owner[p.pos];
    if (own === undefined) return sheet({deck:"buy", d:sq.d});
    if (own === S.turn) return sheet({deck:"corner", icon:"plane", title:DEST[sq.d].name, big:`Home sweet <em>home.</em>`, text:`You own ${DEST[sq.d].name}. Kiss ${esc(O().name)} to celebrate.`});
    return sheet({deck:"rent", d:sq.d, sq:p.pos});
  }
  if (["customs","turb","duty","lounge"].includes(sq.k)) return sheet({deck:sq.k, card:draw(sq.k)});
  if (sq.k === "gate") return sheet({deck:"corner", icon:"gate", title:"Gate", big:`Right on <em>time.</em>`, text:`Perfect landing on the Gate. Collect your 200 miles and a kiss from ${esc(O().name)}.`});
  if (sq.k === "layover") return sheet({deck:"corner", icon:"layover", title:"Layover", big:`Just <em>visiting.</em>`, text:`Stretch your legs. Give ${esc(O().name)} a 20-second hug while you're here.`});
  if (sq.k === "mile"){ p.miles += 100; O().miles += 100; log(`Mile High Club: both +100 mi.`); hearts(16);
    return sheet({deck:"turb", card:draw("turb"), mile:true}); }
  if (sq.k === "security") return sheet({deck:"corner", icon:"security", title:"Security check", big:`Random <em>search.</em>`, text:`Remove one piece of clothing, then go straight to Layover.`, act:"goLayover", btn:"Off to Layover"});
}
function goLayover(){
  const p = P(); p.pos = 5; p.jail = 3; S.doubles = 0; placeTokens();
  log(`<b>${esc(p.name)}</b> is in Layover.`);
  endTurn(true);
}
function layoverChoice(){ sheet({deck:"layover"}); }
function endTurn(forceSwitch){
  closeSheet();
  if (checkEnd()) return;
  const again = !forceSwitch && S.doubles > 0 && !P().jail;
  if (!again){ S.turn = 1 - S.turn; S.doubles = 0; }
  save(); renderGame();
}
function checkEnd(){
  const broke = S.players.find(x => x.miles < 0);
  const lapsDone = S.laps && S.players.every(x => x.laps >= S.laps);
  if (!broke && !lapsDone) return false;
  S.over = true;
  let winner, reason;
  if (broke){ winner = S.players.find(x => x !== broke); reason = `${broke.name} ran out of miles`; }
  else { winner = score(S.players[0]) >= score(S.players[1]) ? S.players[0] : S.players[1]; reason = `${S.laps} laps completed`; }
  save(); renderGame(); hearts(30);
  sheet({deck:"end", winner, reason, prize:PRIZES[Math.floor(Math.random()*PRIZES.length)]});
  return true;
}

/* ---------- Start ---------- */
if (S.started) renderGame(); else renderSetup();
</script>
