<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a1328">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Elliot Air Lounge"><meta property="og:description" content="Pick your flight for tonight.">
<title>Elliot Air Lounge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Anton&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: an airline lounge. Home = departures board + context filters + game tickets. Each game opens full-page in the same app with a back button. Single dark theme, Elliot Air brand; each game tints the accent. */
:root{
  color-scheme: dark;
  --bg:#0a1328; --surf:#111d38; --surf-2:#16244a; --line:#22355c; --text:#f3f1ec; --muted:#9ea8c2;
  --accent:#ffc94a; --blush:#f4b6c4; --hot:#ff3d5e; --ok:#7be0a4;
  --paper:#f7f3ea; --ink:#141b2e; --navy:#13213f;
  --f-display:"Instrument Serif", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-code:"Anton", Impact, "Arial Narrow", sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 520px at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),radial-gradient(700px 420px at 90% 110%, rgba(255,61,94,.1), transparent 70%);transition:background .6s}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-code);font-size:17px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;cursor:pointer;background:none;border:0;color:var(--text);padding:0}
.logo svg{width:26px;height:26px}
.logo small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent)}
.clock{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.back{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:color-mix(in srgb, var(--surf) 80%, transparent);color:var(--text);border-radius:99px;padding:8px 14px 8px 10px;font-size:13px;font-weight:700}
.back svg{width:16px;height:16px}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,10vw,80px);line-height:.98;margin:0;text-wrap:balance}
h1 em{color:var(--accent)}
h1 .n{color:var(--blush)}
h2.gt{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,9vw,60px);line-height:1;margin:0;text-wrap:balance}
h2.gt em{color:var(--accent)}
.lead{font-size:16.5px;color:var(--text);opacity:.88;max-width:54ch;margin:0}
.hero,.ghead{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* Departures board */
.board{background:#070b16;border:1px solid #1c2540;border-radius:16px;overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #1c2540}
.board-head b{font-family:var(--f-code);font-weight:400;font-size:15px;letter-spacing:.2em;color:#ffc94a}
.board-head span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:#6c7799;text-transform:uppercase}
.row{display:grid;grid-template-columns:54px 1fr 140px 92px;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid #121a30;text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit;text-align:left}
.row:last-child{border-bottom:0}
.row.th{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6c7799;padding-block:8px;cursor:default}
.row:not(.th):hover{background:#0c1324}
.flaps{display:flex;gap:2px;overflow:hidden}
.flap{position:relative;width:15px;height:22px;display:grid;place-items:center;background:linear-gradient(#171e33 50%, #121829 50%);border-radius:2px;font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:#ffc94a;flex:none}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#05070e}
.flap.sp{background:transparent}.flap.sp::after{display:none}
.flap.go{animation:flip .08s linear}
@keyframes flip{50%{transform:scaleY(.2)}}
.ctx{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:right;white-space:nowrap;color:#7be0a4}
.st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7be0a4;margin-right:6px;vertical-align:1px;animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}

/* Filters + tickets */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-2px;padding-inline:2px}
.filters::-webkit-scrollbar{display:none}
.chip{appearance:none;cursor:pointer;flex:none;border:1px solid var(--line);background:color-mix(in srgb, var(--surf) 80%, transparent);color:var(--text);border-radius:99px;padding:9px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip svg{width:15px;height:15px;opacity:.85}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:14px}
.tk{position:relative;display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:var(--text);transition:transform .25s, border-color .25s, box-shadow .25s;min-width:0;cursor:pointer;text-align:left;padding:0;font:inherit}
.tk:hover{transform:translateY(-4px);border-color:var(--tc);box-shadow:0 22px 44px -24px var(--tc)}
.tk-art{height:120px;position:relative;overflow:hidden;background:var(--tbg);width:100%}
.tk-art svg{position:absolute;inset:0;width:100%;height:100%}
.tk-tag{position:absolute;top:12px;left:12px;z-index:2;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(7,11,22,.72);color:#f3f1ec}
.tk-heat{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:3px;padding:5px 7px;border-radius:99px;background:rgba(7,11,22,.72)}
.tk-heat i{width:5px;height:12px;border-radius:2px;background:#2b3657}
.tk-heat i.on{background:var(--tc)}
.tk-body{padding:14px 18px 4px;display:flex;flex-direction:column;gap:6px;flex:1}
.tk-code{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tc)}
.tk-name{font-family:var(--f-display);font-size:28px;line-height:1.02;margin:0;font-weight:400}
.tk-name em{color:var(--tc)}
.tk-desc{margin:0;color:var(--muted);font-size:14px}
.tk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 16px;border-top:1px dashed var(--line);margin-top:10px}
.tk-meta{display:flex;gap:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.board-btn{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13px;padding:9px 14px;border-radius:99px;background:var(--tc);color:var(--ink);white-space:nowrap}
.board-btn svg{width:14px;height:14px}
.tk::before,.tk::after{content:"";position:absolute;left:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);bottom:46px;z-index:3}
.tk::after{left:auto;right:-9px}
footer{text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Common game UI */
.btn{appearance:none;cursor:pointer;font-weight:800;font-size:15px;border-radius:99px;padding:14px 24px;border:1px solid var(--accent);background:var(--accent);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s, opacity .2s, box-shadow .2s;box-shadow:0 12px 30px -12px color-mix(in srgb, var(--accent) 50%, transparent)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}
.btn.outline{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none;font-weight:600}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 150px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{appearance:none;cursor:pointer;border:0;border-radius:10px;padding:10px 6px;background:transparent;color:var(--muted);font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.lvseg button[aria-pressed="true"]{background:var(--lc);color:var(--ink);box-shadow:none}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.rules li::before{content:"✈  ";color:var(--accent)}
.card{background:var(--paper);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -26px rgba(0,0,0,.9)}
.card.pop{animation:popin .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes popin{0%{transform:translateY(24px) scale(.6) rotate(-4deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--navy);color:#f7f3ea}
.card-head svg{width:20px;height:20px}
.card-head .t{font-family:var(--f-code);font-size:14px;letter-spacing:.16em;text-transform:uppercase}
.card-head .tag{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--accent);padding:3px 9px;border-radius:99px;white-space:nowrap}
.card-body{padding:20px;display:flex;flex-direction:column;gap:10px;min-height:150px;justify-content:center}
.card-who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b8298}
.card-text{font-family:var(--f-display);font-size:clamp(26px,6.6vw,34px);line-height:1.15;margin:0;color:var(--ink);text-wrap:pretty}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px 16px;border-top:2px dashed rgba(20,27,46,.18);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7b8298}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score div{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.score b{font-weight:800}
.score span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}

/* Flight Plan dice */
.dice{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px}
.die{position:relative;appearance:none;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg, #fbf8f1, #ece4d5);color:var(--ink);padding:14px 14px 16px;min-height:150px;display:flex;flex-direction:column;gap:8px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(20,27,46,.08), 0 16px 30px -18px rgba(0,0,0,.8);transition:transform .2s, box-shadow .2s}
.die .k{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7b8298}
.die .k svg{width:16px;height:16px;color:var(--dc)}
.die .v{font-family:var(--f-code);font-size:clamp(20px,5.4vw,26px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.die .d{font-size:13px;color:#4a5168;line-height:1.35}
.die .lock{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7b8298;display:flex;align-items:center;gap:4px}
.die .lock svg{width:12px;height:12px}
.die[aria-pressed="true"]{box-shadow:0 0 0 3px var(--dc), 0 16px 30px -18px rgba(0,0,0,.8)}
.die[aria-pressed="true"] .lock{color:var(--dc);font-weight:500}
.die.rolling .v,.die.rolling .d{filter:blur(1.5px);opacity:.7}
.die.land{animation:land .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:translateY(-10px) rotate(-2deg) scale(1.04)}100%{transform:none}}
.die::after{content:"";position:absolute;inset:0;border-radius:inherit;border-top:5px solid var(--dc);pointer-events:none}
.die.bonus{grid-column:1 / -1;min-height:auto}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surf);cursor:pointer}
.toggle input{width:44px;height:26px;appearance:none;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(18px)}

/* Strangers */
.reveal{position:relative;appearance:none;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1px solid var(--line);border-radius:20px;background:var(--surf);color:var(--text);padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:170px;overflow:hidden;touch-action:manipulation}
.reveal .cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(45deg, var(--surf) 0 12px, var(--surf-2) 12px 24px);transition:opacity .2s;padding:16px}
.reveal .cover b{font-family:var(--f-code);font-weight:400;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.reveal .cover span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.reveal.open .cover{opacity:0}
.reveal .role{font-family:var(--f-display);font-size:26px;line-height:1.1}
.reveal .mis{font-size:14px;color:var(--muted)}
.reveal .mis b{color:var(--accent)}

/* Cabin pressure */
.gauge{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle, var(--surf) 58%, transparent 59%), conic-gradient(var(--accent) calc(var(--p,0)*1turn), var(--line) 0)}
.gauge.tick{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.gauge .inner{text-align:center;padding:20px}
.gauge .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gauge .nm{font-family:var(--f-display);font-size:40px;line-height:1}
.prompt{font-family:var(--f-display);font-size:clamp(24px,6vw,30px);line-height:1.2;text-align:center;min-height:2.6em;margin:0}
.boom{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(circle, rgba(255,61,94,.0), rgba(255,61,94,.75));animation:boom .9s ease-out both}
@keyframes boom{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* Coin */
.coin-scene{width:170px;height:170px;margin:10px auto;perspective:800px}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.coin .side{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:inset 0 0 0 8px rgba(255,255,255,.35), inset 0 -12px 24px rgba(0,0,0,.18), 0 18px 34px -16px rgba(0,0,0,.8)}
.coin .side svg{width:44%;height:44%}
.coin .side b{position:absolute;bottom:22%;font-family:var(--f-code);font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.coin .a{background:radial-gradient(circle at 35% 30%, #ffe08a, #e5a92c)}
.coin .b{background:radial-gradient(circle at 35% 30%, #ffd3de, #e88aa2);transform:rotateY(180deg)}
.result{text-align:center;font-family:var(--f-display);font-size:34px;line-height:1.1;min-height:1.2em}
.result em{color:var(--accent)}
.qchips{display:flex;flex-wrap:wrap;gap:8px}

/* Slow burn */
.stage-list{display:flex;gap:6px}
.stage-list i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.stage-list i.on{background:var(--accent)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;margin:4px auto;display:grid;place-items:center;background:radial-gradient(circle, var(--paper) 62%, transparent 63%), conic-gradient(var(--navy) calc(var(--p)*1turn), rgba(20,27,46,.12) 0)}
.ring b{font-family:var(--f-mono);font-weight:500;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Lists (dispatch, island) */
.check{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.check input{appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);margin:1px 0 0;display:grid;place-items:center;cursor:pointer;flex:none}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"✓";color:var(--ink);font-weight:800;font-size:14px}
.check span{font-size:14.5px}
.check.done span{opacity:.5;text-decoration:line-through}
.list{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.mission{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mission .who{display:flex;align-items:center;gap:8px;font-weight:800}
.mission .who i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--ink)}
.mission .who i svg{width:12px;height:12px}
.mission p{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.2}

#toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top, 0px));display:flex;flex-direction:column;gap:6px;width:min(420px, calc(100vw - 32px));pointer-events:none}
.toast{background:var(--surf);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:0 14px 30px -14px #000;animation:popin .35s ease both}
.view-in{animation:viewin .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .row{grid-template-columns:44px 1fr 70px;gap:10px;padding-inline:12px}
  .row .ctx{display:none}
  .row.th span:nth-child(3){display:none}
  .flap{width:13px;height:20px;font-size:11px}
  .logo small{display:none}
  .die{min-height:140px;padding:12px}
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
let view = "home", cleanup = null;
const setAccent = c => document.documentElement.style.setProperty("--accent", c || "#ffc94a");
function header(){
  return `<div class="top">
    ${view === "home" ? `<button class="logo" id="logoBtn">${LOGO}Elliot Air<small>Lounge</small></button>` : `<button class="back" id="backBtn">${I.back}Lounge</button>`}
    <div class="clock" id="clock">${clockText()}</div>
  </div>`;
}
function go(v){
  if (cleanup){ cleanup(); cleanup = null; }
  view = v; const g = GAMES.find(x => x.id === v);
  setAccent(g ? g.color : null);
  if (v === "home") renderHome(true); else GAMEVIEWS[v]();
  window.scrollTo({top:0, behavior: reduceMotion ? "auto" : "smooth"});
  try { history.replaceState(null, "", v === "home" ? location.pathname + location.search : "#" + v); } catch(e){}
}
function mount(html, title){
  app.innerHTML = header() + `<section class="view-in" style="display:flex;flex-direction:column;gap:20px">${html}</section>`;
  const b = document.getElementById("backBtn"); if (b) b.onclick = () => go("home");
  const l = document.getElementById("logoBtn"); if (l) l.onclick = () => go("home");
}

  /* ---- Wheel of Turbulence ---- */
  wheel(){
    const g = G("wheel");
    const st = store.get("wheel", {lv:"chill", turn:"elliot", res:null});
    let angle = 0, spinning = false, tInt = null;
    cleanup = () => clearInterval(tInt);
    const wheelSVG = lv => { const a = WHEEL[lv].a, cols = [LVC[lv], "#f7f3ea"]; const R = 96;
      return `<svg viewBox="0 0 200 200" style="width:100%;height:100%">${a.map((x,i) => { const a0 = (i*45-22.5)*Math.PI/180, a1 = (i*45+22.5)*Math.PI/180;
        return `<path d="M100 100L${(100+R*Math.sin(a0)).toFixed(2)} ${(100-R*Math.cos(a0)).toFixed(2)}A${R} ${R} 0 0 1 ${(100+R*Math.sin(a1)).toFixed(2)} ${(100-R*Math.cos(a1)).toFixed(2)}z" fill="${cols[i%2]}" stroke="#0a1328" stroke-width="1"/><text x="100" y="${i%2?36:36}" text-anchor="middle" transform="rotate(${i*45} 100 100)" font-family="Anton, Impact, sans-serif" font-size="11" letter-spacing=".5" fill="#141b2e">${esc(x[0].toUpperCase())}</text>`; }).join("")}<circle cx="100" cy="100" r="14" fill="#0a1328" stroke="#f7f3ea" stroke-width="2"/></svg>`; };
    const paint = () => {
      const r = st.res;
      mount(`${gameHead(g, "Spin, then do it for the time shown. You take turns spinning. Whoever spins is the one who gives.")}
        ${lvSeg(st.lv)}
        <div style="position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto">
          <div style="position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #f7f3ea;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))"></div>
          <div id="wh" style="width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px #13213f, 0 30px 60px -20px ${LVC[st.lv]};transform:rotate(${angle}deg)">${wheelSVG(st.lv)}</div>
        </div>
        <button class="btn wide" id="spin">${I.spark}${P[st.turn].name}, spin</button>
        ${r ? `<div class="card pop"><div class="card-head">${I.spark}<span class="t">Turbulence</span><span class="tag" style="background:${LVC[r.lv]}">${r.lv}</span></div>
          <div class="card-body"><div class="card-who">${P[r.giver].name} to ${P[other(r.giver)].name}</div><p class="card-text">${esc(WHEEL[r.lv].a[r.a][1])} · <em style="color:#b0425f">${esc(r.z)}</em></p>
          <div class="ring" id="ring"><b id="left">${r.t}s</b></div></div>
          <div class="card-foot"><span>${r.t} seconds</span><button class="btn" id="wt" style="padding:8px 14px;font-size:13px">${I.timer}Start</button></div></div>` : ""}`);
      document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { st.lv = b.dataset.lv; st.res = null; store.set("wheel", st); paint(); });
      document.getElementById("spin").onclick = spin;
      const wt = document.getElementById("wt");
      if (wt) wt.onclick = () => { clearInterval(tInt); let s = r.t; const f = () => { const l = document.getElementById("left"), rg = document.getElementById("ring"); if (!l){ clearInterval(tInt); return; } l.textContent = s + "s"; rg.style.setProperty("--p", (1 - s/r.t).toFixed(3)); if (s-- <= 0){ clearInterval(tInt); l.textContent = "Done"; beep(880,.3); buzz([120,60,120]); } }; f(); tInt = setInterval(f, 1000); };
    };
    const spin = () => {
      if (spinning) return; spinning = true; clearInterval(tInt);
      const W = WHEEL[st.lv], i = Math.floor(Math.random()*8);
      const jitter = (Math.random()-.5)*30;
      const base = Math.ceil(angle/360)*360 + 360*(4+Math.floor(Math.random()*2));
      const target = base - i*45 + jitter;
      const done = () => { angle = target % 360; st.res = {lv:st.lv, giver:st.turn, a:i, z:rnd(W.z), t:rnd(W.t)}; st.turn = other(st.turn); store.set("wheel", st); spinning = false; beep(660,.15); buzz([30,40,30]); if (view === "wheel") paint(); };
      const el = document.getElementById("wh");
      if (reduceMotion){ return done(); }
      const an = el.animate([{transform:`rotate(${angle}deg)`},{transform:`rotate(${target}deg)`}], {duration:3600, easing:"cubic-bezier(.12,.75,.18,1)", fill:"forwards"});
      let last = 0; const tick = () => { if (!spinning) return; const t = an.currentTime || 0; if (t - last > 120 && t < 3000){ beep(500, .02); last = t; } requestAnimationFrame(tick); }; requestAnimationFrame(tick);
      an.onfinish = done;
    };
    paint();
  },

  still(){
    const g = G("still");
    const st = store.get("still", {lv:"chill", cap:"elliot", score:{elliot:0, eunice:0}});
    let tInt = null, phase = "ready", tease = null, pen = null;

    const paint = () => {

          <div class="card-body">${phase==="broke" ? `<div class="card-who">${P[vic].name} moved</div><p class="card-text">${esc(pen)}</p>` :

        <div class="btns">${phase==="ready" || phase==="broke" || phase==="survived" ? `<button class="btn wide" id="go">${I.timer}${phase==="ready" ? "Start" : "Next round"}</button>` :
          `<button class="btn" id="ok">Survived</button><button class="btn outline" id="ko">${P[vic].name} moved</button>`}</div>
        <div class="score">${["elliot","eunice"].map(k => `<div><b>${P[k].name}</b><span>${st.score[k]} survived</span></div>`).join("")}</div>`);
      document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { st.lv = b.dataset.lv; phase = "ready"; clearInterval(tInt); store.set("still", st); paint(); });
      document.querySelectorAll("[data-cap]").forEach(b => b.onclick = () => { st.cap = b.dataset.cap; phase = "ready"; clearInterval(tInt); store.set("still", st); paint(); });
      const go_ = document.getElementById("go");

  /* ---- Yes, No, Maybe ---- */
  match(){
    const g = G("match");
    const st = store.get("match", {lvs:["chill","sexy","extreme"], phase:"intro", i:0, ans:{eunice:{}, elliot:{}}});
    const items = () => MATCH.map((m,k) => ({...m, k})).filter(m => st.lvs.includes(m.l));
    const save = () => store.set("match", st);
    const paint = () => {
      const L = items();
      let body = "";
      if (st.phase === "intro"){
        body = `<div class="panel"><div class="label">Include</div><div class="btns">${LV.map(l => `<button class="chip" data-inc="${l.k}" aria-pressed="${st.lvs.includes(l.k)}" style="${st.lvs.includes(l.k)?`background:${LVC[l.k]};border-color:${LVC[l.k]};color:var(--ink)`:""}">${l.n}</button>`).join("")}</div>
          <p style="margin:0;color:var(--muted);font-size:14px">${L.length} ideas. Eunice goes first, alone, then hands the phone to Elliot. Only what you both want shows at the end.</p></div>
          <button class="btn wide" id="startM" ${L.length?"":"disabled"}>Eunice starts ${I.arrow}</button>`;
      } else if (st.phase === "pass"){
        body = `<div class="card pop"><div class="card-head">${I.phone}<span class="t">Hand over</span><span class="tag">Private</span></div><div class="card-body"><p class="card-text">Eunice is done. Pass the phone to Elliot. No peeking at the answers.</p></div></div>
          <button class="btn wide" id="contM">I'm Elliot ${I.arrow}</button>`;
      } else if (st.phase === "result"){
        const E = st.ans.eunice, H = st.ans.elliot;
        const yes = L.filter(m => E[m.k]==="y" && H[m.k]==="y"), maybe = L.filter(m => !(E[m.k]==="y" && H[m.k]==="y") && ["y","m"].includes(E[m.k]) && ["y","m"].includes(H[m.k]));
        const hidden = L.length - yes.length - maybe.length;
        const list = (arr) => arr.length ? `<div class="list">${arr.map(m => `<div class="check" style="cursor:default;grid-template-columns:auto 1fr auto"><i style="width:10px;height:10px;border-radius:50%;background:${LVC[m.l]};margin-top:6px"></i><span>${esc(m.t)}</span><span class="label">${m.l}</span></div>`).join("")}</div>` : `<div class="empty">Nothing here yet.</div>`;
        body = `<div class="card pop"><div class="card-head">${I.heart}<span class="t">Your matches</span><span class="tag">${yes.length} yes</span></div><div class="card-body"><p class="card-text">${yes.length ? `You both said yes to ${yes.length} thing${yes.length>1?"s":""}.` : "No mutual yes yet. Look at the maybes."}</p></div><div class="card-foot"><span>${maybe.length} worth talking about</span><span>${hidden} kept private</span></div></div>
          <div class="label">Both said yes</div>${list(yes)}
          <div class="label">Yes + maybe · talk about it</div>${list(maybe)}
          <button class="btn outline wide" id="resetM">Play again</button>`;
      } else {
        const who = st.phase, m = L[st.i];
        body = `<div class="label">${P[who].name} · ${st.i+1} / ${L.length}</div><div class="bar"><i style="width:${st.i/L.length*100}%"></i></div>
          <div class="card pop"><div class="card-head">${I[P[who].tok]}<span class="t">${P[who].name} only</span><span class="tag" style="background:${LVC[m.l]}">${m.l}</span></div><div class="card-body" style="min-height:180px"><p class="card-text">${esc(m.t)}</p></div></div>
          <div class="btns"><button class="btn" data-a="y">Yes</button><button class="btn outline" data-a="m">Maybe</button><button class="btn outline" data-a="n">No</button></div>
          ${st.i ? `<button class="btn ghost" id="undo">Back</button>` : ""}`;
      }
      mount(`${gameHead(g, "Swipe privately, one at a time. The app only reveals what you both want. A no is never shown.")}${body}`);
      document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { const k = b.dataset.inc, j = st.lvs.indexOf(k); j < 0 ? st.lvs.push(k) : st.lvs.splice(j,1); save(); paint(); });
      const s = document.getElementById("startM"); if (s) s.onclick = () => { st.phase = "eunice"; st.i = 0; st.ans = {eunice:{}, elliot:{}}; save(); paint(); };
      const c = document.getElementById("contM"); if (c) c.onclick = () => { st.phase = "elliot"; st.i = 0; save(); paint(); };
      const r = document.getElementById("resetM"); if (r) r.onclick = () => { st.phase = "intro"; save(); paint(); };
      const u = document.getElementById("undo"); if (u) u.onclick = () => { st.i--; save(); paint(); };
      document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
        const L2 = items(); st.ans[st.phase][L2[st.i].k] = b.dataset.a; st.i++; buzz(10);
        if (st.i >= L2.length){ st.phase = st.phase === "eunice" ? "pass" : "result"; st.i = 0; if (st.phase === "result") beep(880,.2); }
        save(); paint();
      });
    };
    paint();
  }

};

/* Generic deck game with heat levels */
function deckGame(id, cfg){
  const g = G(id);
  const st = store.get(id, Object.assign({lv:"chill", card:null, turn:"eunice"}, cfg.init || {}));
  const pull = () => { st.card = draw(id + st.lv, cfg.deck[st.lv]); };
  const paint = anim => {
    mount(`${gameHead(g, cfg.sub)}${cfg.top ? cfg.top(st) : ""}${lvSeg(st.lv)}
      <div class="card ${anim?"pop":""}"><div class="card-head">${I[cfg.icon]}<span class="t">${cfg.title}</span><span class="tag" style="background:${LVC[st.lv]}">${st.lv}</span></div>
        <div class="card-body">${st.card == null ? `<p class="card-text">Pick a level, then draw.</p>` : cfg.body(st)}</div>
        <div class="card-foot"><span>${cfg.foot}</span><span>${cfg.deck[st.lv].length} cards</span></div></div>
      ${st.card == null ? `<button class="btn wide" data-x="draw">Draw a card ${I.arrow}</button>` : cfg.actions(st)}
      ${cfg.bottom ? cfg.bottom(st) : ""}`);
    document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { st.lv = b.dataset.lv; pull(); store.set(id, st); paint(true); });
    document.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { const x = b.dataset.x; if (x !== "draw" && cfg.act) cfg.act(st, x); pull(); store.set(id, st); buzz(12); paint(true); });
    if (cfg.bind) cfg.bind(st, paint);
  };
  paint(false);
}

/* ---------- Clock + stars + start ---------- */
function clockText(){ return "KUL " + new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Kuala_Lumpur"}); }
setInterval(() => { const c = document.getElementById("clock"); if (c) c.textContent = clockText(); }, 10000);
(() => {
  const c = document.getElementById("stars"), x = c.getContext("2d"); let st = [], W, H, d;
  const size = () => { d = Math.min(devicePixelRatio || 1, 1.5); W = c.width = innerWidth*d; H = c.height = innerHeight*d; st = Array.from({length:Math.round(innerWidth*innerHeight/11000)}, () => ({x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.1+.3)*d, p:Math.random()*6.28})); };
  const f = t => { x.clearRect(0,0,W,H); x.fillStyle = "#f3f1ec"; for (const s of st){ x.globalAlpha = .18 + .3*Math.sin(s.p + t/1600); x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); } if (!reduceMotion) requestAnimationFrame(f); };
  addEventListener("resize", size); size(); requestAnimationFrame(f);
})();
const start = (location.hash || "").slice(1);
if (GAMEVIEWS[start]) go(start); else renderHome(true);
</script>
